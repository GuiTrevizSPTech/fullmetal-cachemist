# Configuração usada só nos testes: H2 em memória, para não depender do MySQL estar ligado
spring.datasource.url=jdbc:h2:mem:testes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cache.max-itens=5
app.cache.ttl-segundos=60
app.biblioteca.atraso-ms=0
